[project]
name = "cowork-server"
dynamic = ["version"]
description = "FastAPI backend for the MindsHub Cowork desktop app"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "MindsDB Inc", email = "admin@mindsdb.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "alembic>=1.17.0",
    # Releases before ENG-2116 remain allowed until Anton ships the supplier;
    # build_llm_client capability-gates that kwarg and reports the degradation.
    "anton-agent>=2.26.8.23.1,<3",
    # Capped <49: 49+ drops the macOS universal2 wheel, breaking Intel-Mac installs.
    "cryptography>=48.0.0,<49",
    "fastapi>=0.136.1",
    "hermes-agent>=0.15.2,<0.18",
    "httpx>=0.27",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "psycopg[binary]>=3.2",
    # psycopg 3 is what the code targets, but the hosted DB URIs come from the
    # shared mindsdb DB stack, which mints every service's URI as bare
    # `postgresql://`. SQLAlchemy maps that scheme to the psycopg2 dialect, so
    # the driver has to be present or `db-migrate` dies on import.
    "psycopg2-binary>=2.9",
    "redis>=5,<6",
    "python-multipart>=0.0.28",
    "sqlmodel>=0.0.38",
    "tzlocal>=5.0",
    "uvicorn>=0.47.0",
    # Document export (md/html → pdf/docx). All pure-Python, no native
    # deps — keeps the desktop install clean across platforms.
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
    "python-docx>=1.1.2",
    "htmldocx>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/mindsdb/cowork-server"
Repository = "https://github.com/mindsdb/cowork-server"
Issues = "https://github.com/mindsdb/cowork-server/issues"

[project.scripts]
cowork-server = "cowork.cli:main"
cowork-dev-setup = "cowork.cli:dev_setup_main"

[project.optional-dependencies]
channels = [
    "slack-sdk>=3.27.0",
    "aiohttp>=3.9.0",
    "discord.py>=2.3.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0-dev"

[tool.hatch.build.targets.wheel]
packages = ["cowork"]

[tool.uv]
# hermes-agent pins Pillow==12.2.0 exactly (still true as of its latest
# upstream commit), which blocks picking up Pillow security fixes. Override
# it project-wide so the resolver isn't held back by that inner pin.
override-dependencies = ["pillow>=12.3.0"]

[tool.uv.sources]
# Stacked feature dependency: cowork-server imports the artifact-identity
# derivation (`resolve_artifact_id`, `canonical_artifact_id`, `artifact_key`)
# from Anton, and persists what Anton only derives in memory, so the two must
# agree on the value or one artifact ends up with two identities. Anton `main`
# carries those symbols, so this pin no longer holds the tree on a staging
# commit the way it did while that feature was unreleased.
#
# This rev is the head of Anton's ENG-2116 hotfix branch
# (`fix/eng-2116-refresh-active-jwt-main`), cut from Anton `main`. It adds the
# typed provider-auth error and the per-request API-key supplier that refresh
# desktop credentials without rebuilding an active session. It is not yet an
# ancestor of Anton `main`, so merge mindsdb/anton#429 first, then re-pin to
# the resulting Anton `main` commit, or back to `branch = "main"`, before this
# PR merges: the image installs from this lockfile (`uv sync --frozen`), and a
# rev on an unmerged branch must not reach a cowork-server main build.
#
# Published package metadata still permits older Anton versions.
# `services/providers.py` capability-gates the live supplier and logs when it
# must retain the static construction-time key, and `handlers/turn_errors.py`
# keeps the legacy 401 classifier available under that skew.
anton-agent = { git = "https://github.com/mindsdb/anton.git", rev = "b4471472bcbc205661a339c1e67a48a2f804e6fe" }
# pinned: upstream HEAD (v0.18.0) requires cryptography==46, conflicts with our >=48
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent.git", rev = "44ddc552f5e054759a6970af8997ea588a9d81c9" }

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "fakeredis>=2.37.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Redis; skips itself when none is reachable",
    "postdeploy: runs against a deployed cowork-server; skips unless COWORK_BASE_URL is set",
]
