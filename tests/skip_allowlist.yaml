# Tests that may be left out of a run that requires every prerequisite
# (COWORK_REQUIRE_INTEGRATION or COWORK_REQUIRE_SERVICES set to true).
# tests/skip_guard.py fails such a run for any other skip or --deselect.
# Each entry names one test id and says why that run can't hold it.

- test: tests/integration/test_disconnect_worker.py::test_opted_in_disconnect_stops_the_executing_remote_worker_cell
  reason: >-
    Operator-run proof. It execs into live worker pods in the scratchpad
    namespace every environment shares, and the CI runner has no pods/exec by
    design. README.md's "Streaming & scheduling" section gives the command.

- test: tests/integration/test_post_deploy.py::test_cancel_ends_the_turn
  reason: >-
    Premise check. When the model ends the turn before it can be seen running,
    there is nothing to cancel, so the run proves nothing for this test. That
    is a fact about the deployment's speed, not a defect.

- test: tests/integration/test_post_deploy.py::test_reconnect_replays_a_turn_in_progress
  reason: >-
    Premise check. When the model ends the turn before the first answer delta
    lets the client drop mid-answer, the replay and saved answer are still
    checked, but no mid-turn reconnect happened. That is a fact about the
    deployment's speed, not a defect.

- test: tests/integration/test_post_deploy.py::test_reconnect_works_on_the_other_replica
  reason: >-
    Premise check. When the model ends the turn before the first answer delta
    lets the client drop mid-answer on replica A, replica B's replay and saved
    answer are still checked, but no mid-turn reconnect happened. That is a
    fact about the deployment's speed, not a defect.
