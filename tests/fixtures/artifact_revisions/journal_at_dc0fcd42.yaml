# An artifact journal written by cowork-server at staging dc0fcd42, before
# its records had models, for tests/test_artifact_revision_journal_compat.py.
# Each later build must read it, answer as dc0fcd42 did, and write back each
# record it changes with the same keys.
#
# Written through dc0fcd42's own calls: current_source (a system capture),
# save_source (a manual edit), create_agent_repair then cancel_agent_repair
# (repair `cancelled`), create_agent_repair then capture_agent_revision after
# an agent edit (repair `ready`), write_journal_file (comments.json),
# enable_draft_review (the grant), and a save the process died in: its blob,
# pending-source-write.json and source landed, the manifest didn't.
#
# `artifact` holds the folder's own files, `journal` its `.revisions` tree,
# and `expected` what dc0fcd42 answered on a copy: list_revisions (which
# finishes the pending save first), revision_with_content for each revision,
# active_agent_repair, agent_repair_detail for the ready repair, and
# draft_review_grant.

