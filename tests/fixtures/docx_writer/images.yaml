# One <img> per case. picture: true means the bytes reach python-docx and
# the package holds one picture; false means the paragraph reads
# "[image: <alt>]" ("[image]" with no alt) and the package holds no image.
# The images are 3x2 pixels.
- name: png
  src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAACCAIAAAASFvFNAAAAFElEQVR4nGM8wcXFAAZMEIqBgQEAEHIA4C4UN34AAAAASUVORK5CYII="
  alt: "Quarterly chart"
  picture: true
- name: jpeg_with_jfif_marker
  src: "data:image/jpeg;base64,"
  alt: "Quarterly chart"
  picture: true
- name: jpeg_with_exif_marker
