# The audience names, refusal codes, instructions to the agent, patterns, and
# bounds cowork/services/sharing_contract.py holds, written down apart from it
# (tests/test_sharing_contract.py). Each pattern's and bound's comment there
# says which side owns it: MindsHub, the upload service, or this server.
audience_fields:
  - org_allowed
  - allowed_team_ids
  - allowed_user_ids
  - allowed_emails
codes:
  SHARE_ORG_REQUIRED_CODE: share_org_required
  INVALID_ID_CODE: invalid_id
  INVALID_EMAIL_CODE: invalid_email
instructions:
  SHARE_ORG_REQUIRED_INSTRUCTION: >-
    Do not publish it publicly or to a wider audience instead. Tell the user
    that an organization admin can share it with everyone, or offer to share it
    with specific people by email.
patterns:
  REPORT_ID_PATTERN: '[A-Za-z0-9_-]+'
bounds:
  MAX_PEOPLE_PER_RULE: 100
  MAX_TEAMS_PER_RULE: 100
  MAX_ARTIFACT_ID_CHARS: 512
  MAX_NOTIFY_EMAILS: 100
  MAX_NOTIFY_TITLE_CHARS: 200
  MAX_NOTIFY_URL_CHARS: 2048
  MAX_IDS_PER_LOOKUP: 50
  MAX_EMAILS_PER_LOOKUP: 50
  MAX_IDS_PER_REQUEST: 200
  MAX_EMAILS_PER_REQUEST: 200
  MAX_EMAIL_CHARS: 320
  MAX_IDS_QUERY_CHARS: 8000
  MAX_EMAILS_QUERY_CHARS: 64800
  MAX_DIRECTORY_ROWS: 500
  LEGACY_RULE_USER_DIR_CHARS: 9
