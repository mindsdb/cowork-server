name: Unit Tests

on:
  workflow_call:
    inputs:
      anton-ref:
        description: >-
          anton git ref to test against, overriding the committed anton-agent
          pin for the duration of this job only. Staging-line callers pass
          "staging" so cowork-server's staging code is validated against anton's
          staging HEAD rather than the committed (main-line) pin — this is what
          lets a cross-repo change ride staging before it reaches anton/main
          without hand-pinning an anton SHA. Empty (the default) leaves the pin
          as committed, which is correct for the main/prod line.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Repoint anton-agent at the ref under test, using uv's own dependency
      # editing — robust to however the committed pin is spelled (branch, rev,
      # or SHA), unlike a text substitution. --no-sync updates pyproject + lock
      # only; the install happens in the next step. Ephemeral: it edits the
      # checkout in place, never a commit, so nothing is promoted. The ref is
      # passed via env, not interpolated into the command, to avoid injection.
      - name: Point anton-agent at the ${{ inputs.anton-ref }} ref
        if: inputs.anton-ref != ''
        env:
          ANTON_REF: ${{ inputs.anton-ref }}
        run: uv add "anton-agent @ git+https://github.com/mindsdb/anton.git@${ANTON_REF}" --no-sync

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: make test/unit/coverage
