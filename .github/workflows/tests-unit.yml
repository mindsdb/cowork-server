name: Unit Tests

on:
  workflow_call:
    inputs:
      anton-version:
        description: >-
          Exact published anton-agent version to test against, overriding the
          committed dependency for this job only. Release-line callers resolve
          the package built from the matching Anton branch once so tests,
          images, and wheels use the same artifact. Empty leaves the committed
          dependency unchanged for callers with no release channel.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Replace the committed dependency with the exact requested artifact.
      # Ephemeral: this edits only the job checkout and is never promoted.
      - name: Use the requested anton-agent package
        if: inputs.anton-version != ''
        env:
          ANTON_VERSION: ${{ inputs.anton-version }}
        run: .github/scripts/use-anton-package.sh "${ANTON_VERSION}"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: make test/unit/coverage
