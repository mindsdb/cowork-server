name: Unit Tests

on:
  workflow_call:
    inputs:
      anton-revision:
        description: >-
          Exact Anton commit to test against. Empty keeps the committed
          pyproject/uv.lock dependency.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Use the requested Anton revision
        if: inputs.anton-revision != ''
        env:
          ANTON_REVISION: ${{ inputs.anton-revision }}
        run: .github/scripts/use-anton-revision.sh "${ANTON_REVISION}"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: make test/unit/coverage
