name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check requirements.txt matches uv.lock
        # Snyk's repo scan reads requirements.txt, not uv.lock, so the committed
        # export has to stay in step with the lockfile.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-annotate \
            --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: make test/unit/coverage
