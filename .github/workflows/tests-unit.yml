name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check uv.lock matches pyproject.toml
        # Snyk scans the lockfile, so a lockfile behind pyproject.toml means
        # Snyk is reporting on dependencies we no longer install.
        run: uv lock --check

      # The tests below run WITH the hermes extra, which is not what anyone
      # installs. hermes-agent drops tools, agent, providers, utils and cli at
      # top level, so an import that resolves only through it would pass the
      # suite and fail on the wheel. Import the app from the shipped set first.
      - name: Check the shipped dependency set imports
        # The real install, as opposed to the simulated one in
        # tests/test_hermes_harness_gate.py. registered_harness_ids, not
        # available_harness_ids: this is about what got registered, and the
        # offered list would also drop hermes in org mode with the gate gone.
        # anton is the positive control, so an empty registry cannot pass.
        run: |
          uv sync --group dev
          uv run --no-sync python -c "import cowork.server"
          uv run --no-sync python -c "from cowork.harnesses.base import registered_harness_ids as r; ids = r(); assert 'anton' in ids and 'hermes' not in ids, ids; print('shipped set registers:', ids)"
          uv run --no-sync python -c "from cowork.harnesses.memory.adapter import get_memory_adapter as g; assert g('hermes') is not None; print('hermes memory adapter still registered')"

      - name: Install dependencies
        # --extra hermes: hermes-agent is optional for installs but its
        # top-level `tools` registry is what the hermes harness writes into,
        # so without it those tests skip and that contract goes unchecked.
        run: uv sync --group dev --extra hermes

      - name: Run unit tests
        run: make test/unit/coverage
