name: Unit Tests

on:
  workflow_call:
    inputs:
      anton-ref:
        description: >-
          Exact anton git ref to test against, overriding the committed
          anton-agent pin for this job only. Staging-line callers resolve
          anton/staging once and pass its immutable SHA so tests and images use
          the same dependency snapshot. Empty (the default) leaves the
          committed pin unchanged for the main/prod line.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Repoint anton-agent at the ref under test, using uv's own dependency
      # editing — robust to however the committed pin is spelled (branch, rev,
      # or SHA), unlike a text substitution. --no-sync updates pyproject + lock
      # only; the install happens in the next step. Ephemeral: it edits the
      # checkout in place, never a commit, so nothing is promoted. The ref is
      # passed via env, not interpolated into the command, to avoid injection.
      - name: Point anton-agent at the requested ref
        if: inputs.anton-ref != ''
        env:
          ANTON_REF: ${{ inputs.anton-ref }}
        run: uv add "anton-agent @ git+https://github.com/mindsdb/anton.git@${ANTON_REF}" --no-sync

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: make test/unit/coverage
