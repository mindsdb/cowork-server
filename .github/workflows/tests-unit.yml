name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          python-version: "3.12"

      - name: Check uv.lock matches pyproject.toml
        # Snyk scans the lockfile, so a lockfile behind pyproject.toml means
        # Snyk is reporting on dependencies we no longer install.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check exported release dependencies
        run: python scripts/release_contract.py --check

      - name: Run unit tests
        run: make test/unit/coverage

  export-tests-desktop:
    # The desktop app runs on Windows and macOS. On Windows a pinned folder has
    # no directory descriptor and the export's path-segment checks are the
    # only guard on which file it reads, and the Windows lxml wheel bundles a
    # libxml2 that speaks HTTP and FTP. On both, the export's conversion
    # process limits itself less than on Linux: macOS refuses an address-space
    # limit, and Windows has no resource limits at all, so the server's memory
    # watch and wall clock are the limits there. These tests prove, on each
    # desktop OS, that export reads only the artifact's own files, fetches
    # nothing, and that a conversion past its limits is killed and leaves no
    # process behind.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        # Git on the Windows runner turns LF into CRLF at checkout, which
        # would change the bytes of the export fixtures.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run export tests
        # -rs names every skipped test and its reason in the log. The export
        # service tests place files through Windows' rename, which runs only
        # here.
        run: >-
          uv run python -m pytest -rs
          tests/test_artifact_files.py
          tests/test_markdown_render.py
          tests/test_artifact_inline.py
          tests/test_docx_writer.py
          tests/test_export_hostile.py
          tests/test_no_fetch.py
          tests/test_artifact_export_contracts.py
          tests/test_artifact_export_service.py
          tests/test_export_child.py
