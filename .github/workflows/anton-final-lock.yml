name: Lock anton's final release on staging

# Desktop installs exactly the anton-agent cowork/release-requirements.txt
# names. Staging may lock an anton release candidate to test new agent code; a
# production release may not, and `release_contract.py --require-final` keeps
# the staging -> main release PR red until staging locks a final (ENG-4355).
#
# Anton publishes its final in the same weekly release, so this polls PyPI.
# When staging locks a candidate and a newer final exists, it relocks staging to
# that final and opens (or updates) one PR into staging. CI runs on it because
# the release-train App opens it, not GITHUB_TOKEN. A person still reviews and
# merges it: a newer version number does not prove the final carries the
# candidate's code, so the PR's CI is that check.
#
# A scheduled run uses main's copy of this file and starts on main, so the job
# checks out staging explicitly. It arms only once this file reaches main.

on:
  schedule:
    # Every 30 minutes, off the top of the hour. Most runs find nothing to do
    # and exit after one PyPI request.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anton-final-lock
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: bot/anton-final-lock
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          python-version: "3.12"

      - name: Find a final anton to replace a locked candidate
        id: final
        run: python scripts/anton_final_lock.py

      - name: Relock staging to the final
        if: steps.final.outputs.version != ''
        env:
          VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          uv lock --upgrade-package "anton-agent==${VERSION}"
          python scripts/release_contract.py
          python scripts/release_contract.py --check
          git diff --stat

      # Minted only once there is something to write. The App is what makes CI
      # run on the PR; GITHUB_TOKEN-created PRs fire no pull_request workflows.
      - name: Mint release-train App token
        id: app-token
        if: steps.final.outputs.version != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open or update the PR into staging
        if: steps.final.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          LOCKED: ${{ steps.final.outputs.locked }}
          VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="fix(deps): lock anton-agent's final ${VERSION} instead of ${LOCKED} (ENG-4355)"
          EXISTING=$(gh pr list --repo "$REPO" --base staging --head "$BRANCH" --state open --json number,title \
            --jq '.[0] // empty | "\(.number)\t\(.title)"')
          # Already proposed: leave the branch alone, or every run would push a
          # new commit and restart the PR's CI.
          if [ "${EXISTING#*$'\t'}" = "$TITLE" ]; then
            echo "#${EXISTING%%$'\t'*} already proposes ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EXISTING="${EXISTING%%$'\t'*}"

          BOT="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT}" --jq .id)
          git config user.name "$BOT"
          git config user.email "${BOT_ID}+${BOT}@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -am "fix(deps): lock anton-agent's final ${VERSION} instead of ${LOCKED} (ENG-4355)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          BODY=$(cat <<EOF
          Staging locks anton-agent \`${LOCKED}\`, a release candidate. Desktop installs exactly the anton this lock names, so the staging → main release PR stays red until staging locks a final (ENG-4355).

          anton published the final \`${VERSION}\`. This relocks staging to it with \`uv lock --upgrade-package\` and regenerates \`cowork/release-requirements.txt\`. Nothing else changes.

          **Before merging:** a newer version number does not prove \`${VERSION}\` carries the code staging took \`${LOCKED}\` for. Let CI finish, and check that the anton change that motivated the candidate is in the final.

          Opened by \`.github/workflows/anton-final-lock.yml\`. A later run force-pushes this branch if a newer final appears.
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "Updated #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh pr create --repo "$REPO" --base staging --head "$BRANCH" --title "$TITLE" --body "$BODY")
            echo "Opened ${URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
