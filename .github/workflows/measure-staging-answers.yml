name: Measure staging answer CPU

# Called only by the registered nightly workflow's opt-in manual branch.
on:
  workflow_call:
    inputs:
      server-sha:
        description: Exact 40-character cowork-server SHA already deployed to staging
        required: true
        type: string
      model:
        description: Exact model alias to hold constant between baseline and candidate
        required: true
        type: string
      scenario:
        description: Text or a real scratchpad execution on every turn
        required: true
        type: string
      concurrency:
        description: Concurrent conversations (1 to 8)
        required: true
        type: string
      history-turns:
        description: Real setup turns per conversation (0 to 500; excluded from measurement)
        required: true
        type: string
      answers:
        description: Measured answers per conversation (1 to 50)
        required: true
        type: string
      remote-worker-provenance:
        description: Verified controller/worker image and Anton revision for this run
        required: true
        type: string
      quiet-window-confirmed:
        description: Operator has reserved staging and provisioned profiler plus dedicated performance identity
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cowork-staging-answer-measurement
  cancel-in-progress: false

jobs:
  measure:
    runs-on: mdb-dev
    environment: staging
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Require the reserved measurement window
        env:
          CONFIRMED: ${{ inputs.quiet-window-confirmed }}
          TRUSTED_REF: ${{ github.ref }}
        run: |
          case "$TRUSTED_REF" in
            refs/heads/staging|refs/heads/perf/eng-3362-cpu-per-answer) ;;
            *) echo 'Use the reviewed performance branch or staging.' >&2; exit 1 ;;
          esac
          if [ "$CONFIRMED" != true ]; then
            echo 'Reserve staging and prepare the dedicated identity and profiler before measuring.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Check dedicated identity and staging debugger permissions
        env:
          COWORK_PERF_API_KEY: ${{ secrets.COWORK_PERF_API_KEY }}
          COWORK_PERF_ORG_ID: ${{ vars.COWORK_PERF_ORG_ID }}
          COWORK_PERF_USER_ID: ${{ vars.COWORK_PERF_USER_ID }}
        run: |
          for name in COWORK_PERF_API_KEY COWORK_PERF_ORG_ID COWORK_PERF_USER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing dedicated performance input: $name" >&2
              exit 1
            fi
          done
          kubectl -n staging auth can-i get pods --quiet
          kubectl -n staging auth can-i list pods --quiet
          kubectl -n staging auth can-i create pods/exec --quiet
          kubectl -n staging auth can-i patch pods/ephemeralcontainers --quiet
      - name: Set up isolated profiler image builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://remote-buildkit-agent.infrastructure.svc.cluster.local:80
      - name: Authenticate to the existing image registry
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build only the dedicated profiler tag
        id: profiler
        run: |
          image=168681354662.dkr.ecr.us-east-1.amazonaws.com/mindsdb-cowork-server
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file scripts/performance/profiler/Dockerfile \
            --tag "$image:profiler-$GITHUB_SHA" --metadata-file profiler-image.json \
            --push scripts/performance/profiler
          digest=$(python3 -c 'import json; print(json.load(open("profiler-image.json"))["containerimage.digest"])')
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.2'
          python-version: '3.12'
      - name: Install the workload driver's dependencies on the runner
        # The driver does not import cowork or install into serving pods.
        run: |
          uv venv .measurement-venv
          uv pip install --python .measurement-venv 'httpx==0.28.1' 'pydantic==2.12.5'
      - name: Write validated workload configuration
        env:
          MODEL: ${{ inputs.model }}
          SCENARIO: ${{ inputs.scenario }}
          CONCURRENCY: ${{ inputs.concurrency }}
          HISTORY_TURNS: ${{ inputs.history-turns }}
          ANSWERS: ${{ inputs.answers }}
        run: |
          .measurement-venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from scripts.performance.workload import WorkloadConfig
          config = WorkloadConfig(
              model=os.environ['MODEL'], scenario=os.environ['SCENARIO'],
              concurrency=int(os.environ['CONCURRENCY']),
              history_turns=int(os.environ['HISTORY_TURNS']),
              answers_per_conversation=int(os.environ['ANSWERS']),
          )
          Path('measurement-config.json').write_text(config.model_dump_json(indent=2))
          PY
      - name: Measure existing staging processes and answers
        env:
          SERVER_SHA: ${{ inputs.server-sha }}
          WORKER_PROVENANCE: ${{ inputs.remote-worker-provenance }}
          DEBUGGER_IMAGE: ${{ steps.profiler.outputs.image }}
          COWORK_PERF_API_KEY: ${{ secrets.COWORK_PERF_API_KEY }}
          COWORK_PERF_ORG_ID: ${{ vars.COWORK_PERF_ORG_ID }}
          COWORK_PERF_USER_ID: ${{ vars.COWORK_PERF_USER_ID }}
        run: |
          .measurement-venv/bin/python -m scripts.performance.profile_answers \
            --config measurement-config.json --output measurement-results \
            --server-sha "$SERVER_SHA" --remote-worker-provenance "$WORKER_PROVENANCE" \
            --debugger-image "$DEBUGGER_IMAGE"
      - name: Retain measured results and flamegraphs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-answer-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            measurement-results/report.json
            measurement-results/*.svg
          if-no-files-found: warn
          retention-days: 14
