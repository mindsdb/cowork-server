name: snyk-code-debug

# TEMPORARY. Prints the Snyk Code findings so the PR-check failure can be read
# without Snyk UI access. Delete before merge.

on:
  workflow_dispatch:
  push:
    branches:
      - maxabouchar/eng-1634-local-model-base-url

permissions:
  contents: read

jobs:
  snyk-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --sarif-file-output=out.sarif || true
          echo '--- providers.py findings ---'
          python3 -c "import json;d=json.load(open('out.sarif'));[print('ruleId=',r.get('ruleId'),'line=',l['physicalLocation']['region']['startLine'],'level=',r.get('level')) for run in d.get('runs',[]) for r in run.get('results',[]) for l in r.get('locations',[]) if 'services/providers.py' in l['physicalLocation']['artifactLocation']['uri']]"
          echo '--- rule metadata ---'
          python3 -c "import json;d=json.load(open('out.sarif'));[print(x.get('id'),'|',x.get('name'),'|',x.get('shortDescription',{}).get('text')) for run in d.get('runs',[]) for x in run.get('tool',{}).get('driver',{}).get('rules',[]) if 'Hardcoded' in str(x.get('name',''))+str(x.get('id',''))]"
