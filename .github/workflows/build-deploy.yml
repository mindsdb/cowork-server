# The cowork-server image build, defined once.
#
# `dev-build-deploy.yml` and `staging-build-deploy.yml` were the same build and
# scan twice, and `prod-build-deploy.yml` was a third copy of nothing but the unit
# tests and a notify job that `publish.yml` already ran on the same event.
#
# What actually ships this repo is the PyPI wheel, not a container image: the
# desktop app installs `cowork-server` from PyPI (or git, per channel), so
# `publish.yml` and `publish-staging.yml` are the real deploy path. The image
# build exists for the per-PR environments, for the shared `dev` namespace, and
# for the staging/prod Helm deploy below.
#
# ON PERMISSIONS. A called workflow can never exceed its caller's grant, and that
# cap is checked when the workflow FILE IS LOADED, not when a job runs. A job here
# naming a scope any one caller does not grant rejects that caller's whole run as a
# `startup_failure` with zero jobs — and with no job in the run, no notify job can
# So the rule for every job in this file: declare only what EVERY caller grants.
# Nothing here declares a PR scope, which is why the per-PR environment comment is
# NOT in this file — it lives in the pull-request caller, where the grant belongs.
# Putting it here would have forced the push callers to grant `pull-requests: write`
# on the release path just so the file would load.
#
# Do not reach for "inherit it instead": a job that declares nothing is invisible to
# the permission gate, so a caller that forgets the grant fails at RUN time with an
# opaque HTTP 403 rather than failing the lint. Declaring the scope is what makes
# the relationship checkable. The shared `workflow-lint.yml` verifies it on every
# PR.

name: Build and Deploy

on:

  workflow_call:
    inputs:
      build-environment:
        description: "Image flavour and tag prefix (development | staging | production)"
        type: string
        required: true
      build-runner:
        description: "Runner label for deploy and integration; the build runs on ubuntu-latest"
        type: string
        default: mdb-dev
      pr-environment:
        description: "Run the per-PR environment rollout and its access comment"
        type: boolean
        default: false
      deploy-enabled:
        description: >-
          Run the Helm rollout for a long-lived environment. Defaults on, so
          staging is unaffected; a caller sets it false for an environment that
          has nothing deployed yet, where a rollout can only fail.
        type: boolean
        default: true
      deploy-through-argocd:
        description: >-
          Deploy by recording the build in mindsdb/argocd-state for Argo CD to
          sync (dev and staging) instead of running Helm from the runner (prod).
        type: boolean
        default: false

    outputs:
      pr-env-deployed:
        description: >-
          "true" only when the per-PR environment actually rolled out. The
          pipeline succeeding does not mean one exists: without the `deploy`
          label the rollout is skipped and everything else still passes, so a
          caller keying off the pipeline result advertises URLs for an
          environment nobody created.
        value: ${{ jobs.deploy-pr-env.outputs.deployed }}

defaults:
  run:
    shell: bash

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token configure-aws-credentials exchanges for the ECR role.
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version by describing against tags, and the
          # default fetch-depth of 1 fetches none of them — so the image
          # reported 0.0.0.dev1+g<sha> while the wheel from the same commit
          # reported a real CalVer (ENG-1796). `publish.yml`'s own publish job
          # already checks out with fetch-depth: 0 for exactly this reason;
          # this build was the one path that did not.
          #
          # WHY THIS AND NOT A BUILD ARG. setuptools-scm's Docker guidance, and
          # the anton half of ENG-1796, both compute the version on the runner
          # and pass SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<dist> in — which keeps
          # .git out of the context entirely, so there is no deletion step and
          # no ordering contract to guard. That is the cleaner shape in the
          # abstract, and it is the right one for anton, where .dockerignore
          # excludes .git and the image is single-stage: a build arg is the only
          # option there that does not ship history to every pod.
          #
          # Here the trade runs the other way. This repo already keeps .git in
          # the context deliberately (.dockerignore says so) and already has a
          # builder/final boundary to delete it behind, so fetching tags is the
          # smaller change against the existing design rather than a redesign of
          # it. The cost is real and worth naming: one deletion step plus the
          # ordering contract between it and `uv sync`, both pinned by tests.
          # If that ever needs touching again, prefer the build arg.
          #
          # NOTE this makes .git full history rather than a single commit, and
          # the Dockerfile COPYs the build context into the builder stage. It
          # deletes .git after the sync so the runtime image does not carry it.
          fetch-depth: 0
      - name: Assume the ECR push role
        # github-ecr-push from terraform's github-oidc stack, which every
        # mindsdb repository may assume.
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1
      - id: build
        uses: mindsdb/github-actions/build-image@main
        with:
          module-name: mindsdb-cowork-server
          build-for-environment: ${{ inputs.build-environment }}

  scan:
    runs-on: mdb-dev
    needs: [build]
    name: Scan Minds Image
    steps:
      - uses: actions/checkout@v5
      - uses: mindsdb/github-actions/snyk-docker-scan@main
        with:
          image: ${{ needs.build.outputs.image }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          # Advisory on a PR, blocking on a deploy branch: an upstream CVE should
          # not stop someone iterating, and should stop a release.
          allow-vulns: ${{ inputs.pr-environment && 'true' || '' }}

  deploy-pr-env:
    runs-on: ${{ inputs.build-runner }}
    needs: [build]
    if: inputs.pr-environment && contains(github.event.pull_request.labels.*.name, 'deploy')
    environment:
      name: pr-cowork-server-${{ github.event.pull_request.number }}
      url: https://pr-cowork-server-${{ github.event.pull_request.number }}.dev.mindshub.ai
    outputs:
      deployed: ${{ steps.rollout.outputs.deployed }}
    steps:
      - uses: mindsdb/github-actions/argocd-pr-env-deploy@main
        with:
          argocd-token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          gh-token: ${{ secrets.GH_PULL_REQUEST_READ_TOKEN }}
      - name: Record that the environment is up
        id: rollout
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  integration-tests-pr-env:
    needs: [deploy-pr-env]
    uses: ./.github/workflows/tests-integration.yml
    with:
      deploy-env: pr-cowork-server-${{ github.event.pull_request.number }}
      runner: ${{ inputs.build-runner }}
    secrets: inherit

  deploy:
    runs-on: ${{ inputs.build-runner }}
    # `scan` too: it is blocking on a deploy branch (see `allow-vulns` above), and
    # needing only `build` meant a failing scan and a rollout ran side by side.
    needs: [build, scan]
    # Only staging and production builds roll out here. A `development` build is
    # a PR, which `deploy-pr-env` and `deploy-argocd` handle, or nothing.
    # `deploy-enabled` gates it further: having a cluster is not the same as
    # having something deployed in it, and a rollout into an environment that
    # was never stood up fails every run without saying anything useful.
    if: inputs.deploy-enabled && !inputs.deploy-through-argocd && (inputs.build-environment == 'staging' || inputs.build-environment == 'production')
    env:
      # `build-environment` names the image flavour (production); the Helm chart,
      # namespace and Slack message name the environment (prod). One is not the
      # other, so map once here rather than at each use.
      DEPLOY_ENV: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
    environment:
      # Spelled out rather than `env.DEPLOY_ENV`: `environment` is resolved before
      # the job's `env` block exists, and only takes github/needs/strategy/matrix/
      # vars/inputs.
      name: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
      url: ${{ vars.MDB_ENV_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: mindsdb/github-actions/setup-env@main
      - name: Notify of deployment starting
        id: slack
        uses: mindsdb/github-actions/slack-deploy-msg@main
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: 'started'
          color: '#0099CC'
          env-name: ${{ env.DEPLOY_ENV }}
          env-url: ${{ vars.MDB_ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
      - uses: DevOps-Nirvana/aws-helm-multi-deploy-nodocker@v8
        with:
          environment-slug: ${{ env.DEPLOY_ENV }}
          k8s-namespace: ${{ env.DEPLOY_ENV }}
          # build-image tags the image `<build-for-environment>-<sha>`, so this
          # is the image flavour, not DEPLOY_ENV.
          image-tag: ${{ inputs.build-environment }}-${{ env.SLUG }}
          timeout: 600s
      - name: Notify of deployment finish
        uses: mindsdb/github-actions/slack-deploy-msg@main
        if: always()
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: "${{ job.status == 'success' && 'finished' || 'failed' }}"
          color: "${{ job.status == 'success' && '#00C851' || '#FF4444' }}"
          env-name: ${{ env.DEPLOY_ENV }}
          env-url: ${{ vars.MDB_ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
          update-message-id: ${{ steps.slack.outputs.ts }}

  integration-tests:
    # After whichever staging or prod deploy ran. There is no conditional
    # `needs`, so both are listed and the condition picks the one that
    # succeeded; a `deploy-to-dev` rollout through Argo CD runs no tests, as
    # the Helm `deploy-dev` never did.
    needs: [deploy, deploy-argocd]
    if: >-
      !cancelled()
      && (needs.deploy.result == 'success'
          || (needs.deploy-argocd.result == 'success' && inputs.build-environment == 'staging'))
    uses: ./.github/workflows/tests-integration.yml
    with:
      deploy-env: ${{ inputs.build-environment == 'production' && 'prod' || 'staging' }}
      runner: ${{ inputs.build-runner }}
    secrets: inherit

  deploy-argocd:
    # The dev and staging deploy. Records the commit and its image tag in
    # mindsdb/argocd-state, which Argo CD in newdev watches and syncs, then
    # waits for the argocd/<env>/cowork-server commit status Argo CD sets once the sync is
    # healthy, so the Slack message still follows the rollout. `dev` on a PR
    # labeled `deploy-to-dev` from a branch of this repository, on every push
    # while the label stays, as `deploy-dev` did; `staging` on a staging
    # build. No cluster credential, and no `environment:` block: Argo CD
    # creates the GitHub Deployment itself.
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: >-
      inputs.deploy-through-argocd
      && ((inputs.pr-environment
           && github.event.pull_request.head.repo.full_name == github.repository
           && contains(github.event.pull_request.labels.*.name, 'deploy-to-dev'))
          || inputs.build-environment == 'staging')
    permissions:
      contents: read
      # write-env-state sets argocd/<env>/cowork-server to pending on the commit; the wait
      # below reads it.
      statuses: write
    concurrency:
      group: deploy-${{ inputs.pr-environment && 'dev' || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.pr-environment && 'dev' || 'staging' }}
      # The commit Argo CD renders the chart from, and the tag build-image
      # pushed for it: the PR head on a pull request, since GitHub drops the
      # merge commit once the PR closes; the pushed commit otherwise.
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_TAG: ${{ inputs.build-environment }}-${{ github.event.pull_request.head.sha && 'head-' || '' }}${{ github.event.pull_request.head.sha || github.sha }}
      ENV_URL: https://cowork.${{ inputs.pr-environment && 'dev' || 'staging' }}.mindshub.ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Same check as the Helm deploy: a superseded run must not record an
      # older commit over the newer one's.
      - name: Check this commit is still the branch tip
        id: freshness
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::${GITHUB_SHA} is no longer the tip of ${GITHUB_REF_NAME} (now ${tip}). That commit's run deploys instead."
          fi
      - name: Notify of deployment starting
        id: slack
        if: steps.freshness.outputs.superseded != 'true'
        uses: mindsdb/github-actions/slack-deploy-msg@main
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: 'started'
          color: '#0099CC'
          env-name: ${{ env.DEPLOY_ENV }}
          env-url: ${{ env.ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
      - name: Mint a token for argocd-state
        id: release-train
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mindsdb
          repositories: argocd-state
          permission-contents: write
      - uses: mindsdb/github-actions/write-env-state@main
        if: steps.freshness.outputs.superseded != 'true'
        with:
          env: ${{ env.DEPLOY_ENV }}
          service: cowork-server
          sha: ${{ env.DEPLOY_SHA }}
          tag: ${{ env.IMAGE_TAG }}
          token: ${{ steps.release-train.outputs.token }}
      - name: Wait for Argo CD
        if: steps.freshness.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/status" --jq ".statuses[] | select(.context == \"argocd/$DEPLOY_ENV/cowork-server\") | .state")"
            case "$state" in
              success) echo "Argo CD synced $DEPLOY_SHA to $DEPLOY_ENV"; exit 0 ;;
              failure|error) echo "::error::Argo CD reported $state for $DEPLOY_SHA in $DEPLOY_ENV: see the argocd/$DEPLOY_ENV/cowork-server status on the commit"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Argo CD has not reported on $DEPLOY_SHA in $DEPLOY_ENV: see the argocd/$DEPLOY_ENV/cowork-server status on the commit"
          exit 1
      - name: Notify of deployment finish
        uses: mindsdb/github-actions/slack-deploy-msg@main
        if: always() && steps.freshness.outputs.superseded != 'true'
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYMENTS_CHANNEL_ID }}
          status: "${{ job.status == 'success' && 'finished' || 'failed' }}"
          color: "${{ job.status == 'success' && '#00C851' || '#FF4444' }}"
          env-name: ${{ env.DEPLOY_ENV }}
          env-url: ${{ env.ENV_URL }}
          slack-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
          update-message-id: ${{ steps.slack.outputs.ts }}
