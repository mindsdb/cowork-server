name: Staging - Build and Deploy.

on:
  push:
    branches:
      - staging

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel any existing runs of this workflow on the same branch/pr
# We always want to build/deploy/test a new commit over an older one
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  # No unit-test job here: `publish-staging.yml` runs `tests-unit.yml` on this
  # same push, and it is the one that gates the wheel.

  workflow-lint:
    # actionlint, the caller/callee permission check, and a zizmor audit, from the
    # one place every service repo shares.
    permissions:
      contents: read
    uses: mindsdb/github-actions/.github/workflows/workflow-lint.yml@main
    with:
      default-permissions: read
    secrets: inherit

  build-deploy:
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: staging
    secrets: inherit
