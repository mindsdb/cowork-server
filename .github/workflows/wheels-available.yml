name: Wheels Available

# Every platform we ship to must be installable from wheels alone.
#
# The desktop app installs this package with `uv tool install` on user machines
# that have no compiler, and the PyPI install channel deliberately ships no
# Xcode Command Line Tools step. So when a dependency resolves to a version
# with no wheel for an architecture, uv falls back to building it from source
# and the app dead-ends at "Install cowork-server".
#
# That is not hypothetical. cryptography stopped publishing macOS x86_64 wheels
# at 49.0.0; a cap was added in #320 to hold Intel Macs on 48.x, and a routine
# dependency bump (#502) deleted it five weeks later. Nothing in this repo went
# red, and the next Intel-Mac user to install was hard-blocked (ENG-2864).
# This job is what would have caught it, on the PR that removed the constraint.
#
# It runs on PRs AND before both publishes, because those catch different
# things: the PR run blames the change, and the publish run is what stops a
# broken artifact reaching PyPI when a dependency's wheel matrix changes under
# a tree nobody touched.
#
# It also runs WEEKLY on the default branch, because neither of those covers
# the gap between releases. A dependency can drop a wheel with no commit here
# at all, and we do not publish on a fixed cadence, so a tree that was green
# when it published can be broken for every new install a week later with
# nothing red anywhere. That is the shape of the incident this file exists for:
# cryptography dropped the macOS x86_64 wheel on 2026-06-12 and it surfaced two
# months later as a blocked user. The schedule turns "caught at the next
# publish, whenever that is" into "caught within a week".

on:
  workflow_call:
  schedule:
    # Mondays 06:17 UTC, ahead of the weekly release train.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wheels-available:
    # GitHub-hosted and secret-free on purpose, like the unit tests: this is
    # resolution only, it never executes dependency code, and a fork
    # contributor gets the signal that matters to them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Resolution only — no venv, no install. The script cross-resolves for
      # every platform via `--python-platform`, so one ubuntu runner covers
      # macOS and Windows too, and no Intel-Mac hardware is needed.
      - name: Check every shipped platform resolves to versions with wheels
        run: bash scripts/check_wheels_available.sh

  notify:
    # A scheduled run has no PR and no release to fail, so without this it goes
    # red where nobody looks. Only on the schedule: the workflow_call paths
    # already surface through their caller's own checks and notify jobs.
    needs: wheels-available
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "wheel availability (weekly check)"
      status: ${{ needs.wheels-available.result == 'failure' && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
