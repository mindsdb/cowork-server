name: Auto-release and publish to PyPI

# Stable release stream: on every push to main, cut a CalVer release and
# publish it to PyPI. The publish job MUST live in this top-level workflow
# (not a reusable one) — PyPI Trusted Publishing does not support reusable
# workflows, and matches the OIDC claim on THIS filename. Register
# publish.yml as a trusted publisher (environment `pypi`) at
# https://pypi.org/manage/project/cowork-server/settings/publishing/
#
# THIS IS THE PROD PIPELINE. `prod-build-deploy.yml` used to run on the same event
# and contained nothing this file does not: the same unit tests and the same notify
# job, with its build, scan, and deploy jobs all commented out. It was a second run
# tree per release that reported on a subset of the first, so it is gone. No image
# is built for prod, deliberately: the desktop app installs the wheel published
# below, not a container.

# No workflow-level `permissions:` block. It used to grant `contents: write` to
# every job in this file, which only `release` needs — the unit tests and the
# image build got it for nothing, and so would anything added later without
# thinking. Each job below states its own, so the default (read) applies to the
# rest.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-anton:
    name: Resolve Anton stable package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      anton-version: ${{ steps.resolve.outputs.anton-version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the package built from anton/main HEAD
        id: resolve
        run: |
          set -euo pipefail
          ANTON_VERSION=$(.github/scripts/resolve-anton-package.sh main)
          echo "anton-version=$ANTON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using anton-agent==$ANTON_VERSION from anton/main" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    # Explicit, though `contents: read` is also the repo default. A caller job's
    # `permissions` is the CAP on the workflow it calls, so leaving it off makes
    # this file's blast radius a property of Settings -> Actions rather than of
    # the file, and an org-wide flip to read/write would silently widen it.
    # tests-unit.yml declares `contents: read` itself, so this matches exactly.
    permissions:
      contents: read
    needs: resolve-anton
    uses: ./.github/workflows/tests-unit.yml
    with:
      anton-version: ${{ needs.resolve-anton.outputs.anton-version }}

  release:
    needs: unit-tests
    # workflow_dispatch can be pointed at any ref; only main cuts a stable release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "0"
      runs-on: ubuntu-latest

  publish:
    name: Build and publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publisher (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0  # hatch-vcs needs tags to derive version

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher (OIDC) — publish.yml must be registered at the
        # PyPI project's publishing settings (environment: pypi).

  notify:
    # Alert the eng channel if ANY job in the release/publish pipeline fails.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [resolve-anton, unit-tests, release, publish]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "auto-release + PyPI publish"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
