name: Auto-release and publish to PyPI

# Stable release stream: on every push to main, cut a CalVer release and
# publish it to PyPI. The publish job MUST live in this top-level workflow
# (not a reusable one) — PyPI Trusted Publishing does not support reusable
# workflows, and matches the OIDC claim on THIS filename. Register
# publish.yml as a trusted publisher (environment `pypi`) at
# https://pypi.org/manage/project/cowork-server/settings/publishing/

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    uses: ./.github/workflows/tests-unit.yml

  release:
    needs: unit-tests
    # workflow_dispatch can be pointed at any ref; only main cuts a stable release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "0"
      runs-on: ubuntu-latest

  publish:
    name: Build and publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publisher (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0  # hatch-vcs needs tags to derive version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher (OIDC) — publish.yml must be registered at the
        # PyPI project's publishing settings (environment: pypi).

  notify:
    # Alert the eng channel if ANY job in the release/publish pipeline fails.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [unit-tests, release, publish]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "auto-release + PyPI publish"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
