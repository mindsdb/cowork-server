name: Integration Tests

# Runs against a deployment that has just gone up, so it covers the paths that
# only exist between the services: cowork-server, Redis, scratchpad-controller
# and a real scratchpad pod.
on:
  workflow_call:
    inputs:
      deploy-env:
        required: true
        type: string
      ref:
        description: 'Branch/SHA whose tests to run; "" means the ref that triggered the run'
        required: false
        type: string
        default: ""
    outputs:
      pr-env-serving:
        description: >-
          "true" once a PR environment answered with this PR's build. Empty for
          every other target, and for a PR environment that never came up.
        value: ${{ jobs.integration-tests.outputs.pr-env-serving }}

defaults:
  run:
    shell: bash

jobs:
  integration-tests:
    # GitHub-hosted. Every target answers on its public host, so the job needs
    # no cluster credential and no cluster network.
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy-env }}
    outputs:
      pr-env-serving: ${{ steps.serving.outputs.serving }}
    # A real Redis for tests/integration/test_two_replicas.py: two readers that
    # share nothing but Redis, which is how two replicas run. Naming it in
    # COWORK_TEST_REDIS_URL below is what makes an unreachable Redis fail a
    # staging or prod run instead of skipping.
    services:
      redis:
        image: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COWORK_TEST_REDIS_URL: redis://localhost:6379/1
      # The cross-replica test in test_post_deploy.py talks to two pods
      # directly, which takes port-forwards into the cluster. This runner has
      # no cluster access, so the suite leaves that one test out rather than
      # report it as a missing prerequisite. test_two_replicas.py checks the
      # shared-Redis half against the service above. Run the pod test by hand
      # with the port-forwards its docstring shows.
      PYTEST_ADDOPTS: --deselect tests/integration/test_post_deploy.py::test_reconnect_works_on_the_other_replica
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.2"
          python-version: '3.12'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PRIVATE_ACCESS_TOKEN }}
        run: |
          printf "machine github.com\nlogin x-access-token\npassword %s\n" "$GITHUB_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          uv sync --locked --group dev

      # Where to point the tests, and where to get an identity.
      #
      # PR envs: the hosts follow the namespace, and auth's /dev/mint-test-user/
      # is mounted there (it exists only where auth's `ephemeral` setting is on),
      # so no secret is needed and each run gets a fresh throwaway tenant.
      #
      # staging: a standing test user whose key and ids live on the `staging`
      # GitHub Environment (identity source 1 in
      # tests/integration/test_post_deploy.py). prod: a separately managed
      # standing identity that auth resolves and checks live, because mutating
      # the shared emailsink account there is disabled. Hostnames come from a
      # committed env file rather than GitHub Environment variables, so a
      # change is a reviewable diff (same as mindshub_inference).
      #
      # COWORK_REQUIRE_INTEGRATION hands pytest whether a missing prerequisite
      # is a defect. A post-deploy test with no target and no identity skips,
      # and nine skips print the same green as nine passes, which is how this
      # suite ran on every staging push without anyone noticing. Where the
      # environment is supposed to have every prerequisite, a missing one fails:
      # see tests/integration/prereq.py. A PR environment is best effort.
      - name: Resolve the target and the identity source
        env:
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in
            dev|staging|prod) enforce=true ;;
            *)           enforce=false ;;
          esac
          echo "COWORK_REQUIRE_INTEGRATION=$enforce" >> "$GITHUB_ENV"
          if [[ "$DEPLOY_ENV" == pr-* ]]; then
            {
              # cowork-server's own host. ${DEPLOY_ENV}.dev.mindshub.ai without
              # the prefix is the frontend, which answers every path with the
              # SPA: GETs 200 HTML, POSTs 405.
              echo "COWORK_BASE_URL=https://cowork-${DEPLOY_ENV}.dev.mindshub.ai"
              echo "TEST_USER_MINT_URL=https://auth-${DEPLOY_ENV}.dev.mindshub.ai/dev/mint-test-user/"
            } >> "$GITHUB_ENV"
          else
            env_file="tests/integration/envs/.env.${DEPLOY_ENV}"
            if [ ! -f "$env_file" ]; then
              echo "::error::Missing $env_file for deploy-env '$DEPLOY_ENV'"
              exit 1
            fi
            set -a
            # shellcheck source=/dev/null
            . "$env_file"
            set +a
            {
              echo "COWORK_BASE_URL=${COWORK_BASE_URL}"
              if [[ "$DEPLOY_ENV" == "prod" ]]; then
                echo "COWORK_TEST_IDENTITY_MODE=standing"
              fi
            } >> "$GITHUB_ENV"
          fi

      # mindsdb/deployer rolls a labeled PR's image into its environment on a
      # schedule, so the environment can still serve an older build when this
      # job starts. Test only once it serves this PR's head; the module says how
      # it tells.
      - name: Wait until the PR environment serves this build
        id: serving
        if: startsWith(inputs.deploy-env, 'pr-')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python -m tests.integration.wait_for_build
          echo "serving=true" >> "$GITHUB_OUTPUT"

      # Name every empty identity input at once, here, rather than letting the
      # session-scoped identity fixture report the same absence once per test.
      # The suite's own report is seven identical setup errors four seconds into
      # pytest, which reads as a broken test suite rather than as unset
      # configuration. Reads the values only to test them for emptiness and
      # never prints one. Mirrors mindshub_services' scripts/check_integration_inputs.sh.
      - name: Check the standing-identity inputs
        if: ${{ !startsWith(inputs.deploy-env, 'pr-') }}
        env:
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          COWORK_TEST_API_KEY: ${{ secrets.COWORK_TEST_API_KEY }}
          COWORK_TEST_USER_ID: ${{ vars.COWORK_TEST_USER_ID }}
          COWORK_TEST_USER_EMAIL: ${{ vars.COWORK_TEST_USER_EMAIL }}
          COWORK_TEST_ORG_ID: ${{ vars.COWORK_TEST_ORG_ID }}
        run: |
          set -euo pipefail
          # prod resolves the user from its key and matches it against the
          # email. Everywhere else the suite takes the user id as given.
          if [ "$DEPLOY_ENV" = "prod" ]; then
            names="COWORK_TEST_API_KEY COWORK_TEST_USER_EMAIL COWORK_TEST_ORG_ID"
          else
            names="COWORK_TEST_API_KEY COWORK_TEST_USER_ID COWORK_TEST_ORG_ID"
          fi
          # Accumulated as a string: an empty array under `set -u` is an error on
          # bash 3.2, which is what a developer running this locally may have.
          missing=""
          for name in $names; do
            if [ -z "${!name:-}" ]; then
              missing="${missing}${missing:+, }${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required ${DEPLOY_ENV} integration inputs are empty: ${missing}." \
                 "Set them on the '${DEPLOY_ENV}' GitHub Environment: COWORK_TEST_API_KEY is a" \
                 "secret, the others are variables. See README.md."
            exit 1
          fi
          echo "All required ${DEPLOY_ENV} integration inputs are present."

      # The Environment named above decides which values these resolve to, so
      # staging's key never reaches a prod run or the other way round. A PR
      # environment has none, and its caller passes no secrets, so all four are
      # empty there and the suite mints a user instead. Which of them each
      # target reads is decided by _provision_identity in
      # tests/integration/test_post_deploy.py.
      - name: Run integration tests
        env:
          COWORK_TEST_API_KEY: ${{ secrets.COWORK_TEST_API_KEY }}
          COWORK_TEST_USER_ID: ${{ vars.COWORK_TEST_USER_ID }}
          COWORK_TEST_USER_EMAIL: ${{ vars.COWORK_TEST_USER_EMAIL }}
          COWORK_TEST_ORG_ID: ${{ vars.COWORK_TEST_ORG_ID }}
        run: make test/integration
