name: Integration Tests

# Runs against a deployment that has just gone up, so it covers the paths that
# only exist between the services: cowork-server, Redis, scratchpad-controller
# and a real scratchpad pod.
on:
  workflow_call:
    inputs:
      deploy-env:
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  integration-tests:
    # Needs cluster access: the second-replica test port-forwards to individual
    # pods, since the load balancer is free to send both requests to the same one.
    runs-on: mdb-dev
    environment:
      name: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"
          cache-local-path: "/home/runner/_work/_tool/uv-local-cache"
          prune-cache: false
          python-version: '3.12'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PRIVATE_ACCESS_TOKEN }}
        run: |
          printf "machine github.com\nlogin x-access-token\npassword %s\n" "$GITHUB_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          uv sync --locked --group dev

      # Where to point the tests, and where to get an identity.
      #
      # PR envs: the hosts follow the namespace, and auth's /dev/mint-test-user/
      # is mounted there (it exists only where auth's `ephemeral` setting is on),
      # so no secret is needed and each run gets a fresh throwaway tenant.
      #
      # dev/staging/prod: the dev route is deliberately not mounted there, so
      # identity comes from auth's internal provisioning endpoint with the
      # dedicated secret. It provisions the fixed `cowork` suite: one
      # @emailsink.dev tenant reused across runs. The hostnames come from a
      # committed env file rather than GitHub Environment variables, so a change
      # is a reviewable diff (same as mindshub_inference).
      - name: Resolve the target and the identity source
        env:
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENV" == pr-* ]]; then
            {
              # cowork-server's own host. ${DEPLOY_ENV}.dev.mindshub.ai without
              # the prefix is the frontend, which answers every path with the
              # SPA: GETs 200 HTML, POSTs 405.
              echo "COWORK_BASE_URL=https://cowork-${DEPLOY_ENV}.dev.mindshub.ai"
              echo "TEST_USER_MINT_URL=https://auth-${DEPLOY_ENV}.dev.mindshub.ai/dev/mint-test-user/"
            } >> "$GITHUB_ENV"
          else
            env_file="tests/integration/envs/.env.${DEPLOY_ENV}"
            if [ ! -f "$env_file" ]; then
              echo "::error::Missing $env_file for deploy-env '$DEPLOY_ENV'"
              exit 1
            fi
            set -a
            # shellcheck source=/dev/null
            . "$env_file"
            set +a
            {
              echo "COWORK_BASE_URL=${COWORK_BASE_URL}"
              echo "TEST_USER_PROVISION_URL=${COWORK_AUTH_BASE_URL}/v1/internal/test-users/"
            } >> "$GITHUB_ENV"
          fi

      # Only the cross-replica test needs these. The ingress pins a client to
      # one pod by cookie, so both halves of that test would otherwise land on
      # the same replica. Everything else goes through the ingress, which is
      # also what authenticates the Bearer key.
      #
      # One pod is a valid deployment where nobody promised two, so the test
      # skips rather than fails there. In a namespace this runner deploys to,
      # the deploy job just rolled two, so a skip is a failure.
      - name: Port-forward two pods for the cross-replica test
        env:
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          set -euo pipefail
          # PR envs and permanent envs both deploy into a namespace named
          # after the env.
          ns="$DEPLOY_ENV"
          # Which namespaces make a missing replica or a dead port-forward a
          # real defect rather than a known gap in the environment. This job
          # always runs on mdb-dev, so the only namespaces it reaches are
          # newdev's, and `<env>-gha-runner-deploy` carries both `pods list` and
          # `create pods/portforward` in them. `prod` is on newprod and lists
          # nothing from here. A `pr-*` namespace is served by
          # `<env>-gha-runner-prenv`, which is read-only by design. Neither gap
          # is about the change being shipped, so neither goes red. A PR
          # environment also runs one replica, pinned by argocd-envs in
          # parent/templates/cowork-server-app.yaml, so it lands in the one-pod
          # branch below rather than the port-forward one.
          case "$ns" in
            dev|staging) enforce=true ;;
            *)           enforce=false ;;
          esac
          # The same answer, handed to pytest. A post-deploy test with no target
          # and no identity skips, and nine skips print the same green as nine
          # passes, which is how this suite ran on every staging push without
          # anyone noticing. Where the environment is supposed to have every
          # prerequisite, a missing one is a defect: see tests/integration/prereq.py.
          echo "COWORK_REQUIRE_INTEGRATION=$enforce" >> "$GITHUB_ENV"
          # Selected by name rather than by label: the chart comes from an
          # external `deployment` dependency, so its label scheme is not ours to
          # rely on. Deployment pods are always <deployment>-<hash>-<suffix>.
          mapfile -t pods < <(
            kubectl get pods -n "$ns" --field-selector=status.phase=Running \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
              | grep '^cowork-server-' || true
          )
          if [[ "${#pods[@]}" -lt 2 ]]; then
            # Not the same thing, and the messages should not read the same.
            # Zero means this runner cannot see that namespace's pods at all:
            # the job is pinned to mdb-dev, so on the prod release path it lists
            # nothing and has never exercised the cross-replica behaviour.
            if [[ "${#pods[@]}" -eq 0 ]]; then
              detail="No cowork-server pods visible in $ns from this runner."
            else
              detail="Only 1 cowork-server pod in $ns."
            fi
            if [[ "$enforce" == true ]]; then
              # The deploy job just rolled two replicas into this namespace and
              # this runner can read it, so seeing fewer is a real failure.
              echo "::error::$detail The cross-replica test did NOT run."
              exit 1
            fi
            echo "::warning::$detail The cross-replica test did NOT run." \
                 "A green job here says nothing about it."
            exit 0
          fi
          # 9010 is the port uvicorn binds (see the chart's args). Reached
          # directly, so no ingress and no injected identity: the test sends the
          # identity headers itself.
          health=/api/v1/health/
          kubectl port-forward -n "$ns" "pod/${pods[0]}" 8081:9010 >/dev/null 2>&1 &
          kubectl port-forward -n "$ns" "pod/${pods[1]}" 8082:9010 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:8081${health}" >/dev/null \
               && curl -sf "http://localhost:8082${health}" >/dev/null; then
              {
                echo "COWORK_BASE_URL_A=http://localhost:8081"
                echo "COWORK_BASE_URL_B=http://localhost:8082"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          # A warning exits 0, so the job stays green while the cross-replica
          # test silently skips, which reads exactly like "the cross-replica
          # behaviour is fine". So fail where the port-forward is supposed to
          # work, and warn where it is known not to.
          #
          # Reaching here means two pods were listed, so in practice only a
          # deploy namespace gets this far: a PR environment runs one replica and
          # `prod` lists nothing from a runner pinned to mdb-dev. The guard below
          # is there for the day one of those changes, and it is right on its own
          # terms, because `<env>-gha-runner-prenv` is read-only and does not
          # carry `create pods/portforward`, so a PR environment with two pods
          # still could not forward to them.
          echo "::warning::port-forwards to ${pods[0]} and ${pods[1]} never answered ${health}."
          if [[ "$enforce" != true ]]; then
            echo "::warning::The cross-replica test did NOT run. $ns cannot port-forward:" \
                 "the runner is read-only there by design."
            exit 0
          fi
          echo "::error::The cross-replica test did NOT run. Check the runner's pods/portforward RBAC first:" \
               "kubectl -n $ns auth can-i create pods --subresource=portforward" \
               "--as=system:serviceaccount:infrastructure:<env>-gha-runner"
          exit 1

      - name: Run integration tests
        env:
          TEST_USER_PROVISION_SECRET: ${{ secrets.TEST_USER_PROVISION_SECRET }}
        run: make test/integration
