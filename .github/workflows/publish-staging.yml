name: Staging pre-release and publish to PyPI

# rc pre-release stream: on every push to staging, publish a PEP 440
# pre-release (0.YY.M.DD.SEQrcN) to PyPI so staging desktop builds install
# from PyPI exactly like prod (same installer flow, no git/Xcode) while
# following the rc stream. Resolvers ignore pre-releases unless a specifier
# names one, and PyPI's `info.version` (which the prod desktop updater reads)
# excludes them, so prod installs can never pick these up.
#
# The publish job MUST live in this top-level workflow — PyPI Trusted
# Publishing does not support reusable workflows and matches the OIDC claim
# on THIS filename. Register publish-staging.yml as a trusted publisher
# (environment `pypi`) at the PyPI project's publishing settings.

# No workflow-level `permissions:` block. It used to grant `contents: write` to
# every job in this file, which only `release` needs — the unit tests and the
# image build got it for nothing, and so would anything added later without
# thinking. Each job below states its own, so the default (read) applies to the
# rest.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-prerelease-${{ github.ref }}
  cancel-in-progress: false

# THIS IS THE STAGING PIPELINE, not a side workflow. It used to be one of two
# workflows on push to `staging` — this one and `staging-build-deploy.yml` — so
# every merge produced two disconnected run trees and neither showed the whole
# story: the one named "Build and Deploy" did not publish, and the one that
# published did not build.
#
# They merged into this file rather than the other way round because of the
# constraint above: the publish job must live in a top-level workflow whose
# filename the PyPI trusted-publisher claim matches. So this file keeps the name
# and calls the image build as a reusable, which is the only arrangement that gives
# one run tree without breaking publishing.
jobs:
  resolve-anton:
    name: Resolve Anton staging package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      anton-version: ${{ steps.resolve.outputs.anton-version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the package built from anton/staging HEAD
        id: resolve
        run: |
          set -euo pipefail
          ANTON_VERSION=$(.github/scripts/resolve-anton-package.sh staging)
          echo "anton-version=$ANTON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using anton-agent==$ANTON_VERSION from anton/staging" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    # Explicit, though `contents: read` is also the repo default. A caller job's
    # `permissions` is the CAP on the workflow it calls, so leaving it off makes
    # this file's blast radius a property of Settings -> Actions rather than of
    # the file, and an org-wide flip to read/write would silently widen it.
    # tests-unit.yml declares `contents: read` itself, so this matches exactly.
    permissions:
      contents: read
    needs: resolve-anton
    uses: ./.github/workflows/tests-unit.yml
    with:
      # Use the same immutable Anton revision as the staging image build.
      anton-version: ${{ needs.resolve-anton.outputs.anton-version }}

  build-deploy:
    # The container image, for the per-PR environments and whatever comes after.
    # Independent of the release chain on purpose: a scan finding should not hold
    # up the wheel the desktop installs from, and a failed publish should not hide
    # a broken image. Both land in this one run tree, and `notify` covers both.
    permissions:
      contents: read
    needs: resolve-anton
    uses: ./.github/workflows/build-deploy.yml
    with:
      build-environment: staging
      anton-version: ${{ needs.resolve-anton.outputs.anton-version }}
    secrets: inherit

  release:
    needs: unit-tests
    # workflow_dispatch can be pointed at any ref; only staging mints rc tags.
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: write  # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "0"
      prerelease: true
      runs-on: ubuntu-latest

  publish:
    name: Build and publish pre-release to PyPI
    needs: [resolve-anton, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publisher (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0  # hatch-vcs needs tags to derive version

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Use the exact same immutable package already validated by unit tests
      # and the staging image. The desktop reads this exact pin from the
      # cowork-server wheel and restates it as a direct install requirement.
      - name: Pin the validated anton-agent staging package
        env:
          ANTON_VERSION: ${{ needs.resolve-anton.outputs.anton-version }}
        run: .github/scripts/use-anton-package.sh "${ANTON_VERSION}"

      - name: Build package
        env:
          # The anton pin dirties the checkout, which would make hatch-vcs
          # append a +dirty local segment PyPI rejects. Force the version to
          # exactly what the tag encodes.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.release.outputs.version }}
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher (OIDC) — publish-staging.yml must be registered at
        # the PyPI project's publishing settings (environment: pypi).

  notify:
    # Alert the eng channel if ANY job in the staging release/publish pipeline
    # fails.
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [resolve-anton, unit-tests, build-deploy, release, publish]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "staging build + release + PyPI publish"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
