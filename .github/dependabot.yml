# Keep the base image tag current so an OS-level CVE arrives as a pull request
# rather than as a red scan on a release.
version: 2
updates:
  # Both Dockerfile stages pin python:3.12-slim by digest. Dependabot rewrites
  # tag and digest together, so the pin stays a pin.
  - package-ecosystem: docker
    directory: /
    # A push to main here is the prod pipeline — it cuts a CalVer release and
    # publishes to PyPI — so base image bumps soak on staging first.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
