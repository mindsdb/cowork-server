# Applied explicitly by the infrastructure owner; outside the application chart.
# The measurement runner cannot grant itself these permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cowork-answer-profiler
  namespace: staging
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cowork-answer-profiler
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: newdev-gha-runner
    namespace: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cowork-answer-profiler
