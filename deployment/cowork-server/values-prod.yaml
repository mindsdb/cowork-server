deployment:
  ingress:
    enabled: true
    name: cowork-server
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://console.mindshub.ai, https://mdb.ai, https://hub.mindsdb.com"
      nginx.ingress.kubernetes.io/auth-url: "http://auth.prod.svc.cluster.local:80/v1/authenticate/"
    hosts:
      - host: cowork.mindshub.ai
        enableMultiPath: true
        paths:
          # Narrowed from / to /api: the cowork-frontend chart owns / (static
          # SPA) on this host; cowork-server owns the same-origin API prefix.
          - path: /api
            serviceName: cowork-server
            servicePort: 80

  extraEnvs:

    - name: ENV
      value: "prod"

    - name: LOG_LEVEL
      value: "WARNING"

    # Org-mode identity enforcement. 'enforce': requests without identity
    # headers are rejected with 401.
    - name: COWORK_IDENTITY_ENFORCE
      value: "enforce"

    # Turn execution — MUST be set here: the base values.yaml default points at
    # dev, which would have dev's controller running prod turns in dev pods.
    # (COWORK_TURN_MINDS_BASE_URL needs no override — it derives to
    # api.mindshub.ai for prod, which has no env sub-domain.)
    - name: COWORK_TURN_REDIS_URL
      value: "redis://redis-master.prod.svc.cluster.local:6379/0"

    # Agent tool budgets — deployment-level DEFAULTS for users who never set
    # the per-user setting (hosted has no Settings UI; inference cost lands on
    # the operator). Uncommented values below equal the code defaults, so
    # enabling them as-is is behavior-neutral; LOWER them to run hosted more
    # conservatively. Changing these requires a pod restart (env is read once
    # per process).
    # - name: COWORK_DEFAULT_MAX_TOOL_ROUNDS
    #   value: "50"
    # - name: COWORK_DEFAULT_MAX_CONTINUATIONS
    #   value: "5"
