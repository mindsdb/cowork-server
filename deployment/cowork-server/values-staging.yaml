# Staging runs the ingress restriction, as dev, prod and every PR environment
# do. `newdev-gha-runner` gets `create networkpolicies` in this namespace from
# its `<env>-gha-runner-deploy` role. Without it the release fails and --atomic
# rolls the whole deploy back, so confirm it before merging a change here:
#   kubectl --context newdev -n staging auth can-i create networkpolicies \
#     --as=system:serviceaccount:infrastructure:newdev-gha-runner
#
# Watch both replicas stay Ready through the rollout, then run the forged-header
# curl from a pod in another namespace. A port-forward cannot see this policy:
# it enters the pod's network namespace and never crosses the veth where the
# policy is enforced.
networkPolicy:
  enabled: true

deployment:
  # One uvicorn process per pod can use about one core, so cowork-server scales
  # by replicas, not workers (see the `image` comment in values.yaml). The HPA
  # adds a pod when average CPU passes 70% of the 1-CPU request. The subchart's
  # default 90% memory target applies too, as it does for auth.
  #
  # The ceiling stays at 4 because each replica widens a race. Every replica runs
  # the scheduler, and `_due_schedules` in cowork/scheduler.py checks
  # `has_active_run` and then fires with no cross-replica claim. Two replicas
  # polling together can both fire one schedule.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  # Cloud datasource turns and the methods offered, on for staging by the
  # release gate. Rollback removes both lines; see the chart README.
  datasourceTurnsEnabled: "true"
  datasourceCapabilities: '{"manifest_version": 1, "enabled": ["mysql:host-password", "postgres:host-port"]}'

  ingress:
    enabled: true
    name: cowork-server
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://console.staging.mindshub.ai, https://staging.mdb.ai, https://hub.staging.mindsdb.com"
      nginx.ingress.kubernetes.io/auth-url: "http://auth.staging.svc.cluster.local:80/v1/authenticate/"
    hosts:
      - host: cowork.staging.mindshub.ai
        enableMultiPath: true
        paths:
          # Narrowed from / to /api: the cowork-frontend chart owns / (static
          # SPA) on this host; cowork-server owns the same-origin API prefix.
          - path: /api
            serviceName: cowork-server
            servicePort: 80

  # Draft-preview host. values.yaml builds the draft Ingress and the
  # COWORK_DRAFT_* variables from these two; ingress_secondary.enabled is not
  # templated, so it is switched on here too. webOrigin is the primary host
  # above, where the web app runs.
  draftHost: draft-staging.mindshub.co
  webOrigin: https://cowork.staging.mindshub.ai
  ingress_secondary:
    enabled: true

  extraEnvs:

    - name: ENV
      value: "staging"

    - name: ACCESS_LOG_MODE
      value: "all"

    - name: LOG_LEVEL
      value: "WARNING"

    # Org-mode identity enforcement. 'enforce': requests without identity
    # headers are rejected with 401.
    - name: COWORK_IDENTITY_ENFORCE
      value: "enforce"

    # Shows the organization picker. The expected-organization boundary refuses
    # a mismatched tab whatever this says; see README.md.
    - name: COWORK_ORGANIZATION_SWITCH_ENABLED
      value: "true"

    # The agent's browser on the web: the browser router, served on this host
    # under /browser. Unset, the web app offers no browser; see README.md.
    - name: COWORK_BROWSER_ROUTER_URL
      value: "https://cowork.staging.mindshub.ai/browser"

    - name: COWORK_TURN_MINDS_BASE_URL
      value: "https://api.staging.mindshub.ai/v1"

    # Per-task time limit for web turns, in seconds: at it anton asks
    # "Keep going / Stop here" and ends with a summary. 0 or unset turns it
    # off. Above 3600 also needs auth's turn-key limits and the controller's
    # time-limited ceiling raised first; see time_limit_seconds in
    # cowork/common/settings/app_settings.py.
    - name: COWORK_TURN_TIME_LIMIT_SECONDS
      value: "3600"

    # Agent tool budgets — deployment-level DEFAULTS for users who never set
    # the per-user setting (hosted has no Settings UI; inference cost lands on
    # the operator). Uncommented values below equal the code defaults, so
    # enabling them as-is is behavior-neutral; LOWER them to run hosted more
    # conservatively. Changing these requires a pod restart (env is read once
    # per process).
    # - name: COWORK_DEFAULT_MAX_TOOL_ROUNDS
    #   value: "250"
    # - name: COWORK_DEFAULT_MAX_CONTINUATIONS
    #   value: "10"
    # - name: COWORK_DEFAULT_MAX_TURN_TOKENS
    #   value: "25000000"
