# dev runs org mode like staging, so it gets the same ingress restriction (see
# networkPolicy in values.yaml). Merging this does not roll dev: only a push to
# a PR labeled deploy-to-dev does, and the last such push wins, so a branch cut
# before this line rolls the policy away again. Watch both replicas stay Ready
# through the rollout, then run the forged-header curl from a pod in another
# namespace.
networkPolicy:
  enabled: true

deployment:
  ingress:
    enabled: true
    name: cowork-server
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://console.dev.mindshub.ai, https://dev.mdb.ai, https://hub.dev.mindsdb.com"
      nginx.ingress.kubernetes.io/auth-url: "http://auth.dev.svc.cluster.local:80/v1/authenticate/"
    hosts:
      - host: cowork.dev.mindshub.ai
        enableMultiPath: true
        paths:
          # Narrowed from / to /api: the cowork-frontend chart owns / (static
          # SPA) on this host; cowork-server owns the same-origin API prefix.
          - path: /api
            serviceName: cowork-server
            servicePort: 80

  # Draft-preview host. values.yaml builds the draft Ingress and the
  # COWORK_DRAFT_* variables from these two; ingress_secondary.enabled is not
  # templated, so it is switched on here too. webOrigin is the primary host
  # above, where the web app runs.
  draftHost: draft-dev.mindshub.co
  webOrigin: https://cowork.dev.mindshub.ai
  ingress_secondary:
    enabled: true

  extraEnvs:

    - name: ENV
      value: "dev"

    - name: ACCESS_LOG_MODE
      value: "errors"

    - name: LOG_LEVEL
      value: "WARNING"

    # Org-mode identity enforcement. 'enforce': requests without identity
    # headers are rejected with 401.
    - name: COWORK_IDENTITY_ENFORCE
      value: "enforce"

    # Shows the organization picker. The expected-organization boundary refuses
    # a mismatched tab whatever this says; see README.md.
    - name: COWORK_ORGANIZATION_SWITCH_ENABLED
      value: "true"

    # The agent's browser on the web: the browser router, served on this host
    # under /browser. Unset, the web app offers no browser; see README.md.
    - name: COWORK_BROWSER_ROUTER_URL
      value: "https://cowork.dev.mindshub.ai/browser"
